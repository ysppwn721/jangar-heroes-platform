name: Deploy Jangar gallery to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ 不要用 sparse-checkout 收窄检出范围。
          # 这里原先只检出 src / scripts / public，而 `npm run build` 需要根层的
          # package.json、index.html、style.css、script.js、assetctl.config.json
          # ——实测 CI 因此直接失败（Actions run #1）。
          # 仓库 108 MB（主要是 public/models 的双级三维模型，构建必须用到），
          # 全量检出是最稳的选择；想省流量可以显式逐项列出所需的每个路径。
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate models and build the static site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
